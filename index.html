<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOICE CRUSHER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#090b12;
  color:#fff;
  font-family:Arial,"Noto Sans JP",sans-serif;
  display:flex;
  justify-content:center;
  padding:25px 14px;
}
.app{width:100%;max-width:540px}
header{text-align:center;margin:25px 0 30px}
.logo{font-size:38px;font-weight:900;letter-spacing:3px}
.logo span{color:#ff365d}
.subtitle{color:#858b9b;font-size:12px;letter-spacing:3px;margin-top:8px}
.panel{
  background:#141824;
  border:1px solid #292f40;
  border-radius:17px;
  padding:21px;
  margin-bottom:16px;
}
h2{font-size:15px;margin:0 0 17px;color:#dfe4f0}
.status{
  display:flex;align-items:center;gap:10px;
  color:#aab1c2;font-size:13px;
}
.dot{width:9px;height:9px;border-radius:50%;background:#555}
.dot.active{background:#35e69a;box-shadow:0 0 12px #35e69a}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{
  background:#202638;border:1px solid #353d52;
  color:#cbd1df;border-radius:12px;padding:17px 8px;
  cursor:pointer;font-size:14px;font-weight:bold;
}
.mode.selected{
  border:1px solid #ff365d;
  background:#351b2a;color:#ff6480;
}
.mode small{display:block;font-size:11px;color:#9299a9;margin-top:7px}
.control{margin:22px 0}
.control-top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.value{color:#ff5474;font-weight:bold}
input[type=range]{width:100%;margin-top:15px;accent-color:#ff365d;cursor:pointer}
.scale{display:flex;justify-content:space-between;color:#70798c;font-size:10px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-family:inherit}
.main-btn{
  border:0;border-radius:12px;padding:16px;
  font-weight:bold;font-size:15px;cursor:pointer;
}
.start{background:#ff365d;color:white}
.stop{background:#30384b;color:#fff}
.main-btn:disabled{opacity:.4;cursor:not-allowed}
.mute{
  width:100%;margin-top:12px;padding:13px;
  border:1px solid #394256;background:#202638;
  border-radius:11px;color:#fff;cursor:pointer;
}
.note{font-size:11px;line-height:1.8;color:#858da0}
footer{text-align:center;color:#555e70;font-size:11px;margin:25px}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">VOICE <span>CRUSHER</span></div>
  <div class="subtitle">REALTIME MICROPHONE DISTORTION</div>
</header>

<div class="panel">
  <h2>🎙 マイク状態</h2>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status">停止中 - マイク未接続</span>
  </div>
</div>

<div class="panel">
  <h2>⚡ 音割れモード</h2>
  <div class="modes">
    <button class="mode selected" id="crush">
      🔊 バリバリ音割れ
      <small>ブツブツ・ザラザラ</small>
    </button>
    <button class="mode" id="clip">
      📢 マイク音割れ
      <small>大音量のような歪み</small>
    </button>
  </div>
</div>

<div class="panel">
  <h2>🎚 音声調整</h2>

  <div class="control">
    <div class="control-top">
      <span>音割れの強さ</span>
      <span class="value" id="strengthValue">75%</span>
    </div>
    <input id="strength" type="range" min="0" max="100" value="75">
    <div class="scale"><span>弱い</span><span>強い</span></div>
  </div>

  <div class="control">
    <div class="control-top">
      <span>マイク入力音量</span>
      <span class="value" id="inputValue">100%</span>
    </div>
    <input id="inputVolume" type="range" min="0" max="200" value="100">
    <div class="scale"><span>0%</span><span>200%</span></div>
  </div>
</div>

<div class="panel">
  <h2>🎧 音声出力</h2>
  <div class="buttons">
    <button class="main-btn start" id="start">▶ 開始</button>
    <button class="main-btn stop" id="stop" disabled>■ 停止</button>
  </div>
  <button class="mute" id="mute" disabled>🔇 ミュート</button>
</div>

<div class="panel">
  <h2>💡 使い方</h2>
  <div class="note">
    ① 開始を押してマイクを許可します。<br>
    ② 音割れモードを選びます。<br>
    ③ 音割れの強さを調整します。<br>
    ④ スピーカーまたはイヤホンで変換後の声を聞きます。<br><br>
    ※ ハウリング防止のため、イヤホンの使用がおすすめです。
    ※ 音量を上げすぎないようにしてください。
  </div>
</div>

<footer>VOICE CRUSHER © 2026</footer>
</div>

<script>
let audioContext = null;
let microphone = null;
let source = null;
let inputGain = null;
let shaper = null;
let compressor = null;
let outputGain = null;
let muted = false;
let currentMode = "crush";

const $ = id => document.getElementById(id);

function setStatus(text, active) {
  $("status").textContent = text;
  $("dot").classList.toggle("active", active);
}

function makeCurve() {
  if (!shaper) return;

  const amount = Number($("strength").value) / 100;
  const curve = new Float32Array(44100);

  for (let i = 0; i < curve.length; i++) {
    let x = (i * 2) / (curve.length - 1) - 1;
    let y;

    if (currentMode === "crush") {
      // バリバリ・ブツブツ系
      const drive = 1 + amount * 24;
      const levels = Math.max(3, Math.round(32 - amount * 29));
      let driven = Math.max(-1, Math.min(1, x * drive));
      y = Math.round(driven * levels) / levels;
    } else {
      // マイクが割れたようなクリッピング
      const drive = 1 + amount * 30;
      const threshold = 1 - amount * 0.90;
      let driven = x * drive;
      y = Math.max(-threshold, Math.min(threshold, driven));
      y = y / Math.max(threshold, 0.1);
    }

    curve[i] = y;
  }

  shaper.curve = curve;
}

function updateControls() {
  $("strengthValue").textContent = $("strength").value + "%";
  $("inputValue").textContent = $("inputVolume").value + "%";

  if (inputGain) {
    inputGain.gain.value = Number($("inputVolume").value) / 100;
  }

  makeCurve();
}

async function startAudio() {
  try {
    $("start").disabled = true;
    setStatus("マイクに接続しています...", false);

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    microphone = stream;

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();

    source = audioContext.createMediaStreamSource(stream);
    inputGain = audioContext.createGain();
    shaper = audioContext.createWaveShaper();
    compressor = audioContext.createDynamicsCompressor();
    outputGain = audioContext.createGain();

    inputGain.gain.value = Number($("inputVolume").value) / 100;

    compressor.threshold.value = -12;
    compressor.knee.value = 0;
    compressor.ratio.value = 12;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;

    outputGain.gain.value = 0.45;

    shaper.oversample = "none";
    makeCurve();

    source.connect(inputGain);
    inputGain.connect(shaper);
    shaper.connect(compressor);
    compressor.connect(outputGain);
    outputGain.connect(audioContext.destination);

    muted = false;
    $("mute").textContent = "🔇 ミュート";

    $("start").disabled = true;
    $("stop").disabled = false;
    $("mute").disabled = false;

    setStatus("接続中 - リアルタイム変換中", true);

  } catch (error) {
    console.error(error);
    setStatus("マイクを使用できません: " + error.message, false);
    $("start").disabled = false;
    stopAudio();
  }
}

async function stopAudio() {
  if (source) {
    try { source.disconnect(); } catch(e) {}
  }

  if (microphone) {
    microphone.getTracks().forEach(track => track.stop());
  }

  if (audioContext && audioContext.state !== "closed") {
    await audioContext.close();
  }

  audioContext = null;
  microphone = null;
  source = null;
  inputGain = null;
  shaper = null;
  compressor = null;
  outputGain = null;

  $("start").disabled = false;
  $("stop").disabled = true;
  $("mute").disabled = true;
  muted = false;

  $("mute").textContent = "🔇 ミュート";
  setStatus("停止中 - マイク未接続", false);
}

function toggleMute() {
  if (!outputGain) return;

  muted = !muted;
  outputGain.gain.value = muted ? 0 : 0.45;

  $("mute").textContent = muted ? "🔊 ミュート解除" : "🔇 ミュート";
}

function setMode(mode) {
  currentMode = mode;

  $("crush").classList.toggle("selected", mode === "crush");
  $("clip").classList.toggle("selected", mode === "clip");

  makeCurve();
}

$("start").addEventListener("click", startAudio);
$("stop").addEventListener("click", stopAudio);
$("mute").addEventListener("click", toggleMute);

$("crush").addEventListener("click", () => setMode("crush"));
$("clip").addEventListener("click", () => setMode("clip"));

$("strength").addEventListener("input", updateControls);
$("inputVolume").addEventListener("input", updateControls);

window.addEventListener("pagehide", () => {
  if (microphone) {
    microphone.getTracks().forEach(track => track.stop());
  }
  if (audioContext && audioContext.state !== "closed") {
    audioContext.close();
  }
});

updateControls();
</script>
</body>
</html>
